<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Create Account | Be The Reason</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <meta name="description"
        content="Daily inspirational quotes to motivate and uplift. Be the reason someone smiles today with our curated collection of positive, life-changing quotes.">
    <meta name="keywords"
        content="daily quotes, inspirational quotes, motivational quotes, positive quotes, quote of the day, be the reason quotes, uplifting quotes, life quotes, success quotes, happiness quotes, wisdom quotes, daily inspiration, motivational messages, positive thinking, personal growth quotes">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/common/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Manrope', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-wrapper {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        .auth-branding {
            flex: 1;
            background: linear-gradient(135deg, #1a0a0a 0%, #2d0a0a 50%, #1a0a0a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 40px;
            position: relative;
            overflow: hidden;
        }

        .auth-branding::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(230, 57, 70, 0.15) 0%, transparent 60%);
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .auth-branding .logo {
            width: 120px;
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        .auth-branding h1 {
            font-size: 42px;
            font-weight: 800;
            text-align: center;
            line-height: 1.2;
            position: relative;
            z-index: 1;
            margin-bottom: 20px;
        }

        .auth-branding h1 span { color: #e63946; }

        .auth-branding p {
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-size: 16px;
            line-height: 1.7;
            position: relative;
            z-index: 1;
            max-width: 350px;
        }

        .auth-form-side {
            width: 680px;
            background: #111111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 50px 50px;
            overflow-y: auto;
        }

        @media screen and (max-width:1200px) {
            .auth-form-side {
                 width: 480px;
            }
        }


        .auth-form-header {
            margin-bottom: 30px;
        }

        .auth-form-header h2 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .auth-form-header p {
            color: rgba(255,255,255,0.5);
            font-size: 15px;
        }

        .auth-form-header p a {
            color: #e63946;
            text-decoration: none;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255,255,255,0.7);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 14px 18px;
            color: #ffffff;
            font-size: 15px;
            font-family: 'Manrope', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #e63946;
            background: #1f1f1f;
            box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.1);
        }

        .form-group input::placeholder { color: rgba(255,255,255,0.25); }

        .btn-auth {
            width: 100%;
            background: #e63946;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Manrope', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .btn-auth:hover {
            background: #c1121f;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(230, 57, 70, 0.4);
        }

        .btn-auth:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }

        .divider span { color: rgba(255,255,255,0.3); font-size: 13px; }

        .btn-google {
            width: 100%;
            background: transparent;
            color: white;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Manrope', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-google:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.3);
        }

        .google-icon { width: 20px; height: 20px; }

        .auth-message {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .auth-message.error {
            background: rgba(230, 57, 70, 0.15);
            border: 1px solid rgba(230, 57, 70, 0.3);
            color: #ff6b7a;
            display: block;
        }

        .auth-message.success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            display: block;
        }

        .terms-text {
            font-size: 12px;
            color: rgba(255,255,255,0.35);
            text-align: center;
            margin-top: 15px;
            line-height: 1.6;
        }

        .terms-text a {
            color: rgba(255,255,255,0.5);
            text-decoration: underline;
        }

        .back-to-site {
            text-align: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .back-to-site a {
            color: rgba(255,255,255,0.4);
            font-size: 14px;
            text-decoration: none;
            transition: color 0.3s;
        }

        .back-to-site a:hover { color: white; }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 992px) {
            .auth-branding { display: none; }
            .auth-form-side { width: 100%; padding: 40px 30px; }
        }
    </style>
</head>

<body>
    <div class="auth-wrapper">
        <!-- LEFT - Branding -->
        <div class="auth-branding">
            <img src="assets/images/logo.png" alt="Be The Reason" class="logo" onerror="this.style.display='none'">
            <h1>Join the <span>Be The Reason</span> Family</h1>
            <p>Create your free account and be part of a community that inspires positive change every day.</p>
        </div>

        <!-- RIGHT - Form -->
        <div class="auth-form-side">
            <div class="auth-form-header">
                <h2>Create Account</h2>
                <p>Already have an account? <a href="login.html">Sign in</a></p>
            </div>

            <div class="auth-message" id="authMessage"></div>

            <!-- Google Signup -->
            <button class="btn-google" id="googleSignupBtn">
                <svg class="google-icon" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Sign up with Google
            </button>

            <div class="divider"><span>or create with email</span></div>

            <form id="signupForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="signupName" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="signupEmail" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signupPassword" placeholder="Min. 6 characters" required minlength="6">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="signupConfirmPassword" placeholder="Repeat your password" required>
                </div>
                <button type="submit" class="btn-auth" id="signupBtn">Create Account</button>
            </form>

            <p class="terms-text">
                By creating an account, you agree to our 
                <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
            </p>

            <div class="back-to-site">
                <a href="index.html">← Back to Be The Reason</a>
            </div>
        </div>
    </div>

    <script type="module">
       import { auth, db, googleProvider } from './assets/js/firebase-config.js';
    import {
        createUserWithEmailAndPassword,
        signInWithPopup,
        updateProfile,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import {
        doc, setDoc, serverTimestamp, collection, query, where, getDocs, updateDoc
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Redirect if already logged in
    onAuthStateChanged(auth, (user) => {
        if (user) window.location.href = 'dashboard.html';
    });

    const signupForm = document.getElementById('signupForm');
    const signupBtn = document.getElementById('signupBtn');
    const googleSignupBtn = document.getElementById('googleSignupBtn');
    const authMessage = document.getElementById('authMessage');

    function showMessage(message, type = 'error') {
        authMessage.textContent = message;
        authMessage.className = `auth-message ${type}`;
    }

    // Create user doc in Firestore
    async function createUserDoc(user, extraData = {}) {
        const userRef = doc(db, 'users', user.uid);
        await setDoc(userRef, {
            uid: user.uid,
            email: user.email,
            displayName: user.displayName || extraData.displayName || '',
            createdAt: serverTimestamp(),
            orders: [],
            addresses: [],
            discountUsed: false,
            source: extraData.source || 'email',
            ...extraData
        }, { merge: true });
    }

    // NEW: Link guest orders to new account
    async function linkGuestOrders(userEmail, newUserId) {
    try {
        const emailLower = userEmail.toLowerCase();  // ← ADD THIS LINE
        
        const ordersRef = collection(db, 'orders');
        const q = query(
            ordersRef, 
            where('userEmail', '==', emailLower),  // ← Change to emailLower
            where('isGuest', '==', true)
        );
            
            const querySnapshot = await getDocs(q);
            
            if (querySnapshot.empty) {
                console.log('No guest orders found for this email');
                return 0;
            }
            
            let linkedCount = 0;
            const updatePromises = [];
            
            querySnapshot.forEach((orderDoc) => {
                const updatePromise = updateDoc(doc(db, 'orders', orderDoc.id), {
                    userId: newUserId,
                    isGuest: false,
                    hasAccount: true,
                    accountLinkedAt: serverTimestamp(),
                    linkedFromGuest: true
                });
                updatePromises.push(updatePromise);
                linkedCount++;
            });
            
            await Promise.all(updatePromises);
            
            console.log(`✅ Linked ${linkedCount} guest order(s) to new account`);
            return linkedCount;
            
        } catch (error) {
            console.error('Error linking guest orders:', error);
            return 0;
        }
    }

    // Email Signup - UPDATED with order linking
    signupForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('signupName').value.trim();
        const email = document.getElementById('signupEmail').value.trim();
        const password = document.getElementById('signupPassword').value;
        const confirmPassword = document.getElementById('signupConfirmPassword').value;

        if (password !== confirmPassword) {
            showMessage('Passwords do not match!');
            return;
        }

        signupBtn.disabled = true;
        signupBtn.innerHTML = '<span class="spinner"></span> Creating account...';
        authMessage.className = 'auth-message';

        try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            await updateProfile(userCredential.user, { displayName: name });
            await createUserDoc(userCredential.user, { displayName: name, source: 'email' });

            // LINK GUEST ORDERS
            const linkedOrders = await linkGuestOrders(email.toLowerCase(), userCredential.user.uid);

            // Transfer any existing discount eligibility
            const hasDiscount = localStorage.getItem('btr_first_purchase_discount') === 'true';
            if (hasDiscount) {
                await setDoc(doc(db, 'users', userCredential.user.uid), {
                    discountEligible: true
                }, { merge: true });
            }

            // Show success with order count
            if (linkedOrders > 0) {
                showMessage(`🎉 Account created! ${linkedOrders} previous order(s) now linked to your account.`, 'success');
            } else {
                showMessage('Account created! Redirecting...', 'success');
            }
            
            setTimeout(() => window.location.href = 'dashboard.html', 2000);
        } catch (error) {
            let msg = 'Signup failed. Please try again.';
            if (error.code === 'auth/email-already-in-use') msg = 'An account with this email already exists.';
            if (error.code === 'auth/weak-password') msg = 'Password should be at least 6 characters.';
            if (error.code === 'auth/invalid-email') msg = 'Please enter a valid email address.';
            showMessage(msg);
            signupBtn.disabled = false;
            signupBtn.textContent = 'Create Account';
        }
    });

    // Google Signup - UPDATED with order linking
    googleSignupBtn.addEventListener('click', async () => {
        googleSignupBtn.disabled = true;
        try {
            const result = await signInWithPopup(auth, googleProvider);
            await createUserDoc(result.user, { source: 'google' });
            
            // LINK GUEST ORDERS
            await linkGuestOrders(result.user.email.toLowerCase(), result.user.uid);
            
            window.location.href = 'dashboard.html';
        } catch (error) {
            showMessage('Google sign-up failed. Please try again.');
            googleSignupBtn.disabled = false;
        }
    });
    </script>
</body>
</html>
